name: install-boundary

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  install-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Check installable skill boundary
        run: python3 scripts/check_install_boundary.py
      - name: Lint SKILL.md frontmatter
        run: python3 scripts/check_skill_frontmatter.py
      # Model-free, key-free eval checks with the harness pinned. About 4 s locally on a
      # cold uv cache: manifest shape, regex compilation, prompt leakage, ablation
      # targets and audit blockers, then the oracle self-tests on fixed samples.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Validate shared benchmark manifest (skill-eval-harness 0.6.0)
        run: uvx --from skill-eval-harness==0.6.0 skill-benchmark validate --strict-leakage --check-ablations evals/shared-benchmark.json
      - name: Audit shared benchmark manifest
        run: uvx --from skill-eval-harness==0.6.0 skill-benchmark audit-manifest evals/shared-benchmark.json --fail-on-blockers
      - name: Self-test verdict oracles with the harness grader
        run: uvx --from skill-eval-harness==0.6.0 python -m unittest discover -s tests -v
      - name: Self-test eval oracles (known-good and known-bad outputs)
        run: uvx --from skill-eval-harness==0.6.0 python -m unittest discover -s evals/oracles -v
